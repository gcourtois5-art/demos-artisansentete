<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Envoyer le SMS</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#15142e;color:#fff;padding:24px;line-height:1.5}
h1{font-size:1.3rem;margin:0 0 4px}
.num{font-size:1.6rem;font-weight:700;letter-spacing:.03em;margin:8px 0 16px}
.txt{background:#fff;color:#15142e;border-radius:12px;padding:14px;white-space:pre-wrap;font-size:.95rem}
a.btn,button{display:block;width:100%;box-sizing:border-box;text-align:center;font:inherit;font-weight:700;font-size:1.15rem;padding:18px;border-radius:14px;border:0;margin-top:16px;text-decoration:none}
a.btn{background:#f2c230;color:#15142e}
button{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #fff}
.aide{opacity:.7;font-size:.85rem;margin-top:16px}
</style>
</head>
<body>
<h1>SMS à envoyer</h1>
<div class="num" id="num"></div>
<div class="txt" id="txt"></div>
<a class="btn" id="go" href="#">Ouvrir dans Messages</a>
<button id="copie" type="button">Copier le texte</button>
<p class="aide">Relis le message dans Messages avant d'appuyer sur Envoyer. Les données restent dans ton téléphone (elles ne sont pas envoyées au site).</p>
<script>
// données après le # : numéro|texte (le # n'est jamais transmis au serveur)
const h=location.hash.slice(1);
// séparateur « | », parfois réencodé en %7C par le navigateur
const m=h.match(/\||%7C/i);
const i=m?m.index:-1, sep=m?m[0].length:0;
const num=i<0?'':decodeURIComponent(h.slice(0,i)).replace(/[^\d+]/g,'');
const txt=i<0?'Lien incomplet : reviens au Cockpit.':decodeURIComponent(h.slice(i+sep));
if(i<0)document.getElementById('go').style.display='none';
document.getElementById('num').textContent=num.replace(/(\d{2})(?=\d)/g,'$1 ');
document.getElementById('txt').textContent=txt;
document.getElementById('go').href='sms:'+num+'?body='+encodeURIComponent(txt);
document.getElementById('copie').onclick=async()=>{try{await navigator.clipboard.writeText(txt);document.getElementById('copie').textContent='Texte copié'}catch(e){document.getElementById('copie').textContent='Copie impossible : sélectionne le texte'}};
</script>
</body>
</html>
